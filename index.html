<style>
:root{--bg:#ECE9F6;--panel:#fff;--ink:#1D1833;--muted:#665F82;--line:#D3CDE6;--btn:#E5E1F2;--plus:#1F7A47;--minus:#B0303F;--pa:#8A4BC4;--pb:#C98410;--shade:rgba(20,15,40,.55);

:root[data-theme="dark"]{--bg:#12101B;--panel:#1D1830;--ink:#F1EEFA;--muted:#A39DBF;--line:#342D4F;--btn:#2B2445;--plus:#6FCF97;--minus:#F08A96;--pa:#B796F0;--pb:#E8AE4A;--shade:rgba(0,0,0,.65)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;height:100%;background:var(--bg);color:var(--ink);font:500 15px/1.3 system-ui,-apple-system,sans-serif;touch-action:manipulation;-webkit-user-select:none;user-select:none;overflow:hidden}
#app{height:100%;display:flex;flex-direction:column;gap:6px;padding:6px}
.half{position:relative;flex:1;min-height:0;display:flex;flex-direction:column;gap:8px;background:var(--panel);border-radius:18px;padding:8px 10px;border-top:6px solid var(--pc)}
.half[data-p="0"]{--pc:var(--pa);transform:rotate(180deg)}.half[data-p="1"]{--pc:var(--pb)}
.rot{transform:rotate(180deg)}
.head{display:flex;align-items:center;gap:10px;min-height:26px}
.namein{flex:1;min-width:0;border:0;background:transparent;color:var(--ink);font:700 17px system-ui,sans-serif;padding:2px 0;-webkit-user-select:text;user-select:text}
.orbs{display:flex;gap:4px;align-items:center;justify-content:flex-end;max-width:58%;overflow-x:auto}
.orb{flex:0 0 auto;width:26px;height:26px;border-radius:50%;border:0;padding:0;min-height:0;display:flex;align-items:center;justify-content:center;font:800 13px/1 system-ui,sans-serif;color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.75);background:radial-gradient(circle at 35% 30%,rgba(255,255,255,.8),var(--o) 55%,rgba(0,0,0,.4) 125%);box-shadow:0 1px 2px rgba(0,0,0,.4)}
.o-T{--o:#E4DEFF;color:#1D1833;text-shadow:none}.o-C{--o:#D1A21B}.o-S{--o:#CF4455}.o-M{--o:#8A4BC4}.o-F{--o:#3E9B55}.o-V{--o:#3C8DC4}.o-X{--o:#26262E;box-shadow:0 0 0 1px #8b87a3}
.tot{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;font:800 clamp(48px,min(12dvh,24vw),104px)/1 Fraunces,Georgia,serif}
.row{display:flex;gap:6px;align-items:center}
button{font:700 16px system-ui,sans-serif;border:0;border-radius:11px;background:var(--btn);color:var(--ink);min-height:44px;padding:0 6px;cursor:pointer}
button:active{filter:brightness(.88)}
button:focus-visible,input:focus-visible{outline:3px solid var(--pc,var(--pa));outline-offset:1px}
.eff{display:grid;grid-template-columns:1fr 1fr 1.3fr 1fr 1fr;gap:5px}
.eff button{padding:0;font-size:15px}
.eff .m{color:var(--minus)}.eff .p{color:var(--plus)}
.fin{display:flex;justify-content:center;align-items:center;gap:8px;width:100%}.fin b{font:800 18px Fraunces,Georgia,serif;color:var(--plus)}
.segs{display:flex;gap:6px;overflow-x:auto;align-items:stretch;padding-bottom:2px}
.seg{flex:0 0 auto;text-align:center;background:var(--bg);border-radius:11px;padding:3px 6px;-webkit-touch-callout:none;transition:transform .15s}
.seg.hold{transform:scale(.94);transition:transform .55s linear}
.sn{font-size:12px;color:var(--muted);padding:5px 8px 3px;-webkit-touch-callout:none}
.seg .row{justify-content:center;gap:3px}.seg button{min-height:34px;width:32px;padding:0}
.seg b{min-width:22px;font:800 18px Fraunces,Georgia,serif}
.sh{display:flex;justify-content:space-between;align-items:center;gap:6px}.seg .x{min-height:0;width:auto;padding:0 4px;background:none;color:var(--muted);font-size:13px}
.segs .addseg{flex:0 0 auto;width:auto;min-height:0;align-self:center;font-size:13px;padding:9px 10px}
#mid{display:flex;gap:5px;align-items:center;background:var(--panel);border-radius:16px;padding:6px}
.mb{flex:1;min-width:0;min-height:60px;padding:0;font-size:13px}
#tbtn{flex:1.1;min-width:0;min-height:60px;padding:2px 0;display:flex;flex-direction:column;align-items:center;justify-content:center;-webkit-touch-callout:none}
#tbtn span{display:block;font:800 21px/1.15 Fraunces,Georgia,serif}
#tbtn.on{outline:3px solid var(--plus)}
.hov{position:absolute;inset:0;z-index:5;background:var(--panel);border-radius:12px;padding:10px;display:flex;flex-direction:column;gap:8px;overflow:auto}
.hov[hidden]{display:none}
.hov h2{margin:0;font:800 19px Fraunces,Georgia,serif}.hov p{margin:0;color:var(--muted);font-size:13px}
.hov input{flex:0 0 auto;width:100%;min-width:0;height:44px;border:2px solid var(--line);border-radius:11px;background:var(--bg);color:var(--ink);font:700 18px system-ui,sans-serif;text-align:center;padding:0 8px;-webkit-user-select:text;user-select:text}
.wide{width:100%}.row .wide{width:auto;flex:1}
.hov .row input{flex:1;width:auto}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}.grid button{font-size:13px;padding:0 2px;min-height:38px}
.grid5{display:grid;grid-template-columns:repeat(5,1fr);gap:5px}.grid5 button{font-size:13px;padding:0;min-height:36px}
.hov.um{padding:8px;gap:6px}
.uwrap{flex:1;min-height:0;display:flex;justify-content:center}
.ubox{position:relative;height:100%;width:auto;aspect-ratio:450/600}
.ubox img{width:100%;height:100%;display:block;pointer-events:none}
.hit{position:absolute;width:24%;aspect-ratio:1;min-height:0;padding:0;transform:translate(-50%,-50%);border-radius:50%;background:transparent}
.hit:active{background:rgba(255,255,255,.3)}
.ostrip{flex:0 0 auto;display:flex;gap:6px;align-items:center;height:44px}
.ol{flex:1;min-width:0;display:flex;gap:6px;align-items:center;overflow-x:auto;height:44px}
.ol:empty::before{content:"Tocca un simbolo per aggiungerlo";color:var(--muted);font-size:12px;font-weight:500}
.ol .orb{width:36px;height:36px;font-size:15px}
.ostrip>button{padding:0 11px;font-size:14px}
#ov{position:fixed;inset:0;display:flex;flex-direction:column;background:var(--shade);padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
#ov[hidden]{display:none}
.fin.done{outline:2px solid var(--plus)}
.fs .row button[data-a="mn"]{flex:0 0 56px}
.mtot{text-align:center;font:800 24px Fraunces,Georgia,serif;color:var(--plus)}
.step{font-size:12px;color:var(--muted);font-weight:600}
.sh2{display:flex;justify-content:space-between;align-items:center}.xb{min-height:34px;padding:0 14px;font-size:14px}
.pane{position:relative}
.rc{display:flex;flex-direction:column;gap:8px}
.win{text-align:center;opacity:0;transform:scale(.6);display:flex;flex-direction:column;align-items:center;gap:1px}
.crown{width:52px;height:39px}
.eq{font:800 36px/1 Fraunces,Georgia,serif;color:var(--muted)}
.wname{font:800 26px/1.1 Fraunces,Georgia,serif;color:var(--wc);max-width:100%;overflow-wrap:anywhere}
.wsub{font-size:13px;color:var(--muted)}
.rt{width:100%;border-collapse:collapse}
.rt th{font:700 14px system-ui,sans-serif;padding:4px 2px;text-align:center;border-bottom:3px solid var(--c);overflow-wrap:anywhere}
.rt td{padding:4px 2px;text-align:center;font:800 18px Fraunces,Georgia,serif;border-bottom:1px solid var(--line)}
.rt td:first-child,.rt th:first-child{text-align:left;color:var(--muted);font:600 13px system-ui,sans-serif;width:34%}
.rt td small{display:block;font:500 11px system-ui,sans-serif;color:var(--muted)}
.rt tr.grand td{font:800 26px Fraunces,Georgia,serif;border-bottom:0}
.rt tr.grand td:first-child{font:700 13px system-ui,sans-serif}
.conf{position:absolute;inset:0;overflow:hidden;pointer-events:none;border-radius:18px}
.conf i{position:absolute;top:-14px;width:8px;height:14px;opacity:0;border-radius:2px}
.rc.go .win{animation:pop .8s cubic-bezier(.2,1.5,.4,1) forwards}
.rc.go .crown{animation:drop .9s cubic-bezier(.3,1.6,.5,1) both}
.rc.go .rt .w{animation:glow 1.4s ease-in-out 3}
.rc.go .conf i{animation:fall var(--d) ease-in var(--l) forwards}
@keyframes pop{0%{opacity:0;transform:scale(.5)}60%{opacity:1;transform:scale(1.12)}100%{opacity:1;transform:scale(1)}}
@keyframes drop{0%{transform:translateY(-36px) rotate(-14deg)}100%{transform:none}}
@keyframes glow{0%,100%{background:transparent}50%{background:rgba(232,185,35,.3)}}
@keyframes fall{0%{opacity:1;transform:translateY(0) rotate(0)}100%{opacity:.9;transform:translateY(460px) rotate(var(--r))}}
@media (prefers-reduced-motion:reduce){.win{opacity:1;transform:none}.rc.go .win,.rc.go .crown,.rc.go .rt .w{animation:none}.conf{display:none}}

.big{font:800 54px/1 Fraunces,Georgia,serif;text-align:center;padding:6px 0}

.segrow{display:flex;gap:6px;align-items:stretch}.segrow .segs{flex:1;min-width:0}
.menub{flex:0 0 auto;min-height:44px;padding:0 12px;font-size:14px;align-self:center}

#ov{z-index:30}
.mnw{height:100%;display:flex;flex-direction:column;gap:10px;padding:calc(10px + env(safe-area-inset-top,0px)) 12px calc(10px + env(safe-area-inset-bottom,0px))}
.mnw.r{transform:rotate(180deg)}
.mbar{display:flex;gap:8px;justify-content:space-between;align-items:center}.mbar h2{margin:0;font:800 20px Fraunces,Georgia,serif}.mbar button{padding:0 14px;font-size:14px}

#brand{flex:0 0 auto;display:flex;align-items:center;justify-content:center;min-height:110px;border-radius:18px;background:var(--panel);font:800 36px Fraunces,Georgia,serif;color:var(--pa);letter-spacing:.5px}
#brand img{max-width:100%;max-height:110px;display:block}
.mlist{display:flex;flex-direction:column;gap:8px;overflow:auto;flex:1;min-height:0}
.ment{display:flex;justify-content:space-between;align-items:center;width:100%;min-height:64px;padding:0 16px;font-size:18px;text-align:left;background:var(--panel)}
.ment small{font:500 13px system-ui,sans-serif;color:var(--muted)}
.lb{width:100%;min-height:58px;font-size:18px;background:var(--panel);border:2px solid var(--line)}.lb[aria-pressed="true"]{border-color:var(--plus);color:var(--plus)}
.hl{display:flex;flex-direction:column;gap:6px;overflow:auto;flex:1;min-height:0}
.chips{gap:6px}.chip{flex:1;min-width:0;min-height:40px;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;background:var(--panel);border:2px solid var(--line)}.chip[aria-pressed="true"]{border-color:var(--plus);color:var(--plus)}
.hr{display:flex;gap:8px;align-items:center;padding:8px 10px;background:var(--panel);border-radius:12px;border-left:6px solid var(--c)}
.hr .tx{flex:1;min-width:0;font-size:14px;line-height:1.3;overflow-wrap:anywhere}.hr .tm{color:var(--muted);font-size:12px}
.hr.u .tx b{text-decoration:line-through}.hr.u{opacity:.6}
.hr button{min-height:36px;padding:0 10px;font-size:13px;flex:0 0 auto}
.hnote,.hempty{color:var(--muted);font-size:13px;margin:0}
.cbox{background:var(--panel);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:10px}.cbox h2{margin:0;font:800 19px Fraunces,Georgia,serif}.cbox p{margin:0;color:var(--muted);font-size:14px}
#gd{z-index:40}#gd.r{transform:rotate(180deg)}
.ghole{position:absolute;border-radius:14px;box-shadow:0 0 0 100vmax var(--shade);outline:3px solid var(--plus);transition:all .25s}
.gcard{position:absolute;left:12px;right:12px;background:var(--panel);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:8px;box-shadow:0 6px 24px rgba(0,0,0,.35)}
.gcard h2{margin:0;font:800 19px Fraunces,Georgia,serif}.gcard p{margin:0;font-size:14px;color:var(--ink)}.gcard .gn{font-size:12px;color:var(--muted);font-weight:600}
.gcard .row button{font-size:15px}
:root[lang="en"] .umb{font-size:10px;font-weight:600}
</style>
</head>

var MERGE_MS=3000;
function addPts(p,d){
  if(!d)return;
  var n=Date.now(),l=S.log[S.log.length-1];
  S.pts[p]+=d;
  if(l&&l.k==="pts"&&!l.u&&l.p===p&&n-l.t<=MERGE_MS){l.d+=d;l.tot=S.pts[p];l.t=n;if(l.d===0)S.log.pop()}
  else{S.lid=(S.lid||0)+1;S.log.push({id:S.lid,t0:n,t:n,p:p,k:"pts",d:d,tot:S.pts[p]})}
  if(S.log.length>600)S.log.shift();
}
function logFin(p,bac,man){S.lid=(S.lid||0)+1;var n=Date.now();S.log.push({id:S.lid,t0:n,t:n,p:p,k:"fin",bac:bac,man:man})}
function undoEntry(id){
  var e=null;S.log.forEach(function(x){if(x.id===id)e=x});
  if(!e||e.u||e.k!=="pts")return;
  var n=Date.now();e.u=true;S.pts[e.p]-=e.d;S.lid=(S.lid||0)+1;
  S.log.push({id:S.lid,t0:n,t:n,p:e.p,k:"undo",d:-e.d,tot:S.pts[e.p],ref:id});
}

  var win=w<0?'<div class="win" style="--wc:var(--ink)"><div class="eq">=</div><div class="wname">'+tr("draw")+'</div><div class="wsub">'+tr("each",fnum(D[0].t))+'</div></div>'
    :'<div class="win" style="--wc:var(--'+(w===0?"pa":"pb")+')">'+CROWN+'<div class="wname">'+esc(D[w].n)+'</div><div class="wsub">'+tr("wins",fnum(D[w].t),fnum(D[1-w].t))+'</div></div>';
  function row(lbl,k,cls,extra){return '<tr class="'+(cls||"")+'"><td>'+lbl+'</td>'+[0,1].map(function(p){return '<td class="'+(w===p?"w":"")+'"><span class="cnt" data-v="'+D[p][k]+'">0</span>'+(extra?extra(D[p]):"")+'</td>'}).join("")+'</tr>'}
  var head='<tr><th></th>'+[0,1].map(function(p){return '<th class="'+(w===p?"w":"")+'" style="--c:var(--'+(p===0?"pa":"pb")+')">'+esc(D[p].n)+'</th>'}).join("")+'</tr>';
  var tbl='<table class="rt">'+head+row(tr("r_eff"),"e")+row(tr("r_pool"),"b")+row(tr("r_deck"),"mp","",function(x){return '<small>'+x.m+' '+(x.m===1?tr("c1"):tr("cn"))+' × 5</small>'})+row(tr("r_tot"),"t","grand")+'</table>';
  var body='<div class="rc">'+win+tbl+'<div class="row"><button class="wide" data-a="rrev">'+tr("review")+'</button><button class="wide" data-a="gclose">'+tr("close")+'</button></div>'+(w>=0?'<div class="conf">'+cf+'</div>':'')+'</div>';
  ov.innerHTML='<div class="pane rot">'+body+'</div><div class="pane">'+body+'</div>';ov.hidden=false;
  var cells=ov.querySelectorAll(".cnt");
  function reveal(){ov.querySelectorAll(".rc").forEach(function(r){r.classList.add("go")})}
  var rm=window.matchMedia&&matchMedia("(prefers-reduced-motion: reduce)").matches;
  if(rm){cells.forEach(function(c){c.textContent=fnum(+c.dataset.v)});reveal();return}
  var t0=null,dur=1300;
  function step(ts){if(t0===null)t0=ts;var k=Math.min(1,(ts-t0)/dur),e=1-Math.pow(1-k,3);
    cells.forEach(function(c){c.textContent=fnum(Math.round(+c.dataset.v*e))});
    if(k<1)requestAnimationFrame(step);else reveal()}
  requestAnimationFrame(step);
}
function adj(m){var c=Math.max(0,left()+m*60);if(run){end=Date.now()+c*1000}else{rem=c}}
function showTime(){openOv('<h2>'+tr("time_t")+'</h2><div class="big tv">'+fmt(left())+'</div><div class="row"><button class="wide" data-a="tadj" data-d="-5">'+tr("m5")+'</button><button class="wide" data-a="tadj" data-d="5">'+tr("p5")+'</button></div><button class="wide" data-a="gclose">'+tr("ok")+'</button>')}
function toggleTimer(){
  if(run){rem=left();run=false}else{if(rem<=0)rem=3000;run=true;end=Date.now()+rem*1000}
}
setInterval(function(){
  if(run&&left()<=0){run=false;rem=0;try{navigator.vibrate&&navigator.vibrate([300,150,300])}catch(e){}
    openOv('<h2>'+tr("t_up")+'</h2><p>'+tr("t_up_p")+'</p><button class="wide" data-a="gclose">'+tr("ok")+'</button>')}
  var ex=false;S.seg.forEach(function(a){a.forEach(function(s){if(s.u&&Date.now()-s.u.t>UNDO_MS){delete s.u;ex=true}})});if(ex){upd();save()}
  updT();
},250);
var tb=document.getElementById("tbtn");
tb.addEventListener("pointerdown",function(){lp=false;clearTimeout(lt);lt=setTimeout(function(){lp=true;showTime()},550)});
["pointerup","pointerleave","pointercancel"].forEach(function(e){tb.addEventListener(e,function(){clearTimeout(lt)})});
tb.addEventListener("contextmenu",function(e){e.preventDefault()});
var slt=null,sht=null;
function endHold(){clearTimeout(slt);if(sht){sht.classList.remove("hold");sht=null}}
document.addEventListener("pointerdown",function(ev){var n=ev.target.closest&&ev.target.closest(".seg");if(!n)return;var h=n.closest(".half");if(!h)return;var p=+h.dataset.p,k=+n.dataset.k;endHold();sht=n;n.classList.add("hold");slt=setTimeout(function(){endHold();askSeg(p,k)},550)});
["pointerup","pointercancel"].forEach(function(e){document.addEventListener(e,endHold)});
document.addEventListener("contextmenu",function(e){if(e.target.closest&&e.target.closest(".seg"))e.preventDefault()});
function num(el){return parseInt(el.value.replace(/[^0-9]/g,"")||"0",10)||0}
document.addEventListener("click",function(ev){
  var b=ev.target.closest("[data-a]");if(!b)return;
  var a=b.dataset.a,d=+b.dataset.d,pane=b.closest(".hov"),h=b.closest(".half");
  var p=h?+h.dataset.p:+b.dataset.p;
  /* menu, cronologia, lingua, guida */
  if(a==="menu"){openMenu(p);return}
  if(a==="mclose"){closeMenu();return}
  if(a==="mflip"){mv.rot=!mv.rot;renderMenu();return}
  if(a==="hf"){mv.f=+b.dataset.f;renderMenu();return}
  if(a==="mgo"){mv.view=b.dataset.v;renderMenu();return}
  if(a==="lang"){S.lang=b.dataset.l;applyLang();[0,1].forEach(closeH);upd();save();renderMenu();return}
  if(a==="hundo"){mv.view="undo";mv.id=+b.dataset.id;renderMenu();return}
  if(a==="undoyes"){undoEntry(+b.dataset.id);mv.view="hist";upd();save();renderMenu();return}
  if(a==="hcopy"){var lines=S.log.filter(function(e){return mv.f<0||e.p===mv.f}).map(logText).join("\n");copyText(lines,function(ok){if(ok){b.textContent=tr("h_copied");setTimeout(function(){if(b.isConnected)b.textContent=tr("h_copy")},1800)}});return}
  if(a==="guide"){var gpl=mv.rot?0:mv.p;closeMenu();startGuide(mv.p===0&&mv.rot?0:(mv.rot?0:1));return}
  if(a==="gnext"){if(gi>=GUIDE_STEPS.length-1)endGuide();else{gi++;showGuide()}return}
  if(a==="gprev"){if(gi>0){gi--;showGuide()}return}
  if(a==="gskip"){endGuide();return}
  if(a==="pts")addPts(p,d);
  else if(a==="seg"){var k=+b.dataset.k,sc=S.seg[p][k];if(CD[sc.n]!==undefined&&sc.v>0){sc.u={v:sc.v,t:Date.now()};sc.v--}else if(CD[sc.n]===undefined)sc.v=Math.max(0,sc.v+d)}
  else if(a==="segreset"){var sr=S.seg[p][+b.dataset.k];sr.v=CD.Catena;delete sr.u;closeH(p)}
  else if(a==="segundo"){var su=S.seg[p][+b.dataset.k];if(su.u&&Date.now()-su.u.t<=UNDO_MS){su.v=su.u.v}delete su.u}
  else if(a==="segdel"){S.seg[p].splice(+b.dataset.k,1);closeH(p)}
  else if(a==="segadd"){showSeg(p);return}
  else if(a==="segpick"){S.seg[p].push({n:b.dataset.n,v:CD[b.dataset.n]!==undefined?CD[b.dataset.n]:1});closeH(p)}
  else if(a==="custom"){showCustom(p);return}
  else if(a==="cadd"||a==="csub"){var q=num(pane.querySelector(".cn"));addPts(p,(a==="cadd"?q:-q));closeH(p)}
  else if(a==="fin"){if(S.fin[0]&&S.fin[1])showRecap();else showFinal(p,1);return}
  else if(a==="fq"){var i=pane.querySelector(".fn");i.value=num(i)+d;return}
  else if(a==="fzero"){pane.querySelector(".fn").value="0";return}
  else if(a==="fnext"){draft(p).bac=num(pane.querySelector(".fn"));showFinal(p,2);return}
  else if(a==="fback"){draft(p).man=num(pane.querySelector(".mn"));showFinal(p,1);return}
  else if(a==="mn"){var mi=pane.querySelector(".mn");mi.value=Math.max(0,num(mi)+d);updMt(pane);return}
  else if(a==="fok"){var dd=draft(p);dd.man=num(pane.querySelector(".mn"));S.fin[p]={bac:dd.bac,man:dd.man};logFin(p,dd.bac,dd.man);dr[p]=null;closeH(p);upd();save();if(S.fin[0]&&S.fin[1])showRecap();return}
  else if(a==="rrev"){[0,1].forEach(function(k){dr[k]=S.fin[k]?{bac:S.fin[k].bac,man:S.fin[k].man}:null});S.fin=[null,null];closeOv()}
  else if(a==="umori"){showUmori(p);return}
  else if(a==="orb")S.orb[p][b.dataset.c]=(S.orb[p][b.dataset.c]||0)+1;
  else if(a==="odel"){var oc=b.dataset.c;S.orb[p][oc]=(S.orb[p][oc]||0)-1;if(S.orb[p][oc]<=0)delete S.orb[p][oc]}
  else if(a==="oclr")S.orb[p]={};
  else if(a==="close")closeH(p);
  else if(a==="gclose")closeOv();
  else if(a==="timer"){if(lp){lp=false}else toggleTimer()}
  else if(a==="tadj")adj(d);
  else if(a==="new"){
    if(!armed){armed=true;setTimeout(function(){armed=false;upd()},3000);upd();return}
    armed=false;S.pts=[0,0];S.fin=[null,null];dr=[null,null];S.seg=[[],[]];S.orb=[{},{}];S.log=[];run=false;rem=3000;closeH(0);closeH(1);closeOv();
  }
  upd();save();
});
document.addEventListener("input",function(ev){
  var t=ev.target;if(t.classList.contains("mn")){updMt(t.closest(".hov"));return}if(!t.classList.contains("namein"))return;
  S.names[+t.closest(".half").dataset.p]=t.value;save();
});
async function lock(){try{wl=await navigator.wakeLock.request("screen")}catch(e){}}
document.addEventListener("pointerdown",function(){if(!wl||wl.released)lock()},{passive:true});
document.addEventListener("visibilitychange",function(){if(document.visibilityState==="visible")lock()});
applyLang();upd();
})();
</script>
